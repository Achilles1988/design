<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Three-pane — preview</title>
    <style>
      /* ============================================================
         Three-pane (mail) · Flowbite-inspired · WYSIWYG · Light/Dark
         ============================================================ */
      :root{ --nav-w:230px; --list-w:340px; }
      [data-theme="light"]{
        --primary:#1a56db; --primary-weak:#eff6ff; --primary-soft:#e1effe; --on-primary:#ffffff;
        --bg:#f9fafb; --surface:#ffffff; --surface-2:#f3f4f6;
        --border:#e5e7eb; --border-strong:#d1d5db;
        --text:#111827; --text-2:#374151; --muted:#6b7280; --muted-2:#9ca3af;
        --green:#0e9f6e; --green-bg:#def7ec; --red:#e02424; --amber:#c27803; --amber-bg:#fdf6b2;
        --shadow:0 1px 2px rgba(0,0,0,.05);
      }
      [data-theme="dark"]{
        --primary:#3f83f8; --primary-weak:#1e293b; --primary-soft:#233150; --on-primary:#ffffff;
        --bg:#111827; --surface:#1f2937; --surface-2:#111827;
        --border:#374151; --border-strong:#4b5563;
        --text:#f9fafb; --text-2:#e5e7eb; --muted:#9ca3af; --muted-2:#6b7280;
        --green:#31c48d; --green-bg:#0b3b2e; --red:#f98080; --amber:#e3a008; --amber-bg:#3f2e05;
        --shadow:0 1px 2px rgba(0,0,0,.3);
      }
      *,*::before,*::after{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}
      body{width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
        font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
        transition:background .2s ease,color .2s ease;}
      .scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;}
      .scroll::-webkit-scrollbar{width:9px;}
      .scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
      .icon{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
      .icon-sm{width:16px;height:16px;}

      .shell{display:grid;grid-template-columns:var(--nav-w) var(--list-w) 1fr;height:100%;}

      /* Nav (folders) */
      .nav{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px;}
      .nav-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 12px;}
      .nav-logo{width:30px;height:30px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:#fff;}
      .nav-title{font-size:17px;font-weight:800;letter-spacing:-.02em;}
      .compose{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:9px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;margin-bottom:12px;}
      .fold{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--text-2);font-weight:500;cursor:pointer;margin-bottom:1px;}
      .fold:hover{background:var(--surface-2);} .fold.active{background:var(--primary-weak);color:var(--primary);font-weight:600;}
      .fold .txt{flex:1;} .fold .cnt{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);}
      .fold.active .cnt{background:var(--primary-soft);color:var(--primary);}
      .nav-grp{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);padding:14px 12px 6px;}
      .lbl-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}

      /* List (conversations) */
      .list{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
      .list-hd{flex:0 0 auto;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
      .list-hd h2{margin:0;font-size:16px;font-weight:800;} .list-hd .n{color:var(--muted);font-size:13px;}
      .item{display:flex;flex-direction:column;gap:3px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;border-left:3px solid transparent;position:relative;}
      .item:hover{background:var(--surface-2);} .item.active{background:var(--primary-weak);border-left-color:var(--primary);}
      .item.unread .from,.item.unread .subj{color:var(--text);font-weight:700;}
      .item .top{display:flex;justify-content:space-between;gap:8px;}
      .item .from{color:var(--text-2);font-weight:600;} .item .tm{font-size:12px;color:var(--muted-2);flex:0 0 auto;}
      .item .subj{color:var(--text-2);font-weight:500;} .item .snip{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .item .unreaddot{position:absolute;left:8px;top:18px;width:7px;height:7px;border-radius:50%;background:var(--primary);}

      /* Detail (thread) */
      .detail{display:flex;flex-direction:column;min-height:0;background:var(--bg);}
      .detail-hd{flex:0 0 auto;padding:20px 26px;border-bottom:1px solid var(--border);background:var(--surface);}
      .detail-hd h1{margin:0 0 8px;font-size:20px;font-weight:800;letter-spacing:-.02em;}
      .detail-hd .row{display:flex;align-items:center;gap:12px;}
      .detail-hd .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;}
      .detail-hd .nm{font-weight:700;color:var(--text);} .detail-hd .to{color:var(--muted);font-size:13px;} .detail-hd .spacer{flex:1;}
      .detail-hd .tm{color:var(--muted);font-size:13px;}
      .actbtn{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted);border:1px solid var(--border);background:var(--surface);}
      .actbtn:hover{background:var(--surface-2);color:var(--text-2);}
      .thread{flex:1;padding:26px;}
      .mail{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
      .mail p{margin:0 0 14px;color:var(--text-2);} .mail p:last-child{margin-bottom:0;}
      .mail .mhd{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
      .mail .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;}
      .reply{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:12px 16px;color:var(--muted);cursor:text;}
    </style>
  </head>
  <body>
    <div class="shell">
      <!-- Nav: folders -->
      <nav class="nav">
        <div class="nav-brand"><div class="nav-logo"><svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 6l8 6 8-6"/></svg></div><span class="nav-title">Mailbox</span></div>
        <div class="compose"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Compose</div>
        <div class="fold active"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 6l8 6 8-6"/></svg><span class="txt">Inbox</span><span class="cnt">6</span></div>
        <div class="fold"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg><span class="txt">Sent</span></div>
        <div class="fold"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg><span class="txt">Drafts</span><span class="cnt">2</span></div>
        <div class="fold"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .6-5.3 4.6L18 21l-6-3.6L6 21l1.3-7.3L2 9.1l7-.6z"/></svg><span class="txt">Starred</span></div>
        <div class="fold"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg><span class="txt">Trash</span></div>
        <div class="nav-grp">Labels</div>
        <div class="fold"><span class="lbl-dot" style="background:#1a56db"></span><span class="txt">Work</span></div>
        <div class="fold"><span class="lbl-dot" style="background:#0e9f6e"></span><span class="txt">Personal</span></div>
        <div class="fold"><span class="lbl-dot" style="background:#c27803"></span><span class="txt">Finance</span></div>
      </nav>

      <!-- List: conversations -->
      <div class="list">
        <div class="list-hd"><h2>Inbox</h2><span class="n">6 unread</span></div>
        <div class="list-body scroll" id="list"></div>
      </div>

      <!-- Detail: thread -->
      <main class="detail">
        <div class="detail-hd" id="dhd"></div>
        <div class="thread scroll" id="thread"></div>
        <div style="flex:0 0 auto;padding:14px 26px 18px"><div class="reply"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 17l-5-5 5-5M4 12h13a4 4 0 010 8h-1"/></svg>Reply to this thread…</div></div>
      </main>
    </div>

    <script>
      (function(){
        var mails=[
          {from:"Olivia Bennett",em:"olivia@designhub.io",c:"#1a56db",subj:"Q3 roadmap review — agenda",tm:"9:02 AM",unread:true,
           snip:"Adding the finalised agenda for Thursday's review…",
           body:["Hi team,","I've finalised the agenda for Thursday's Q3 roadmap review. We'll cover launch retrospectives, the migration plan and open the floor for prioritisation.","Please add any topics to the shared doc by end of day tomorrow so we can time-box the session properly.","Thanks,\nOlivia"]},
          {from:"Liam Carter",em:"liam@designhub.io",c:"#0e9f6e",subj:"Billing flow migration is ready for review",tm:"8:41 AM",unread:true,
           snip:"The new billing flow is deployed to staging and…",
           body:["Hey,","The new billing flow is on staging and ready for a review pass. I've migrated the legacy dashboard endpoints and everything is passing CI.","Could you take a look before we schedule the production rollout?","— Liam"]},
          {from:"Emma Nguyen",em:"emma@designhub.io",c:"#e74694",subj:"Design tokens v2 shipped 🎉",tm:"Yesterday",unread:false,
           snip:"Dark mode is now fully covered across all surfaces…",
           body:["Team,","Design tokens v2 just shipped to the component library. Dark mode is now fully covered across every surface, and the contrast checks are baked into the build.","Migration notes are in the docs. Let me know if anything looks off.","Emma"]},
          {from:"Noah Walker",em:"noah@designhub.io",c:"#c27803",subj:"Search latency down 60%",tm:"Yesterday",unread:false,
           snip:"Deployed the search-index optimisation to staging…",
           body:["Quick update: the search-index optimisation is live on staging. p95 latency dropped from 420ms to 180ms.","I'll monitor over the weekend and promote to production Monday if it holds.","Noah"]},
          {from:"Ava Martinez",em:"ava@designhub.io",c:"#7e3af2",subj:"Design critique moved to #design-system",tm:"Tuesday",unread:false,
           snip:"Just a heads up — the critique moved channels…",
           body:["Heads up — the weekly design critique has moved to the #design-system channel to keep everything in one place.","Same time, same day. See you there!","Ava"]},
          {from:"Ethan Brooks",em:"ethan@designhub.io",c:"#0694a2",subj:"Incident resolved: media-encoder",tm:"Monday",unread:false,
           snip:"Root cause was a stale cache node. Postmortem…",
           body:["The media-encoder incident is fully resolved. Root cause was a stale cache node that failed to drain during the last deploy.","A full postmortem with action items is attached. No customer data was affected.","Ethan"]}
        ];
        function initials(n){return n.split(' ').map(function(x){return x[0];}).join('');}
        var lh='';
        mails.forEach(function(m,i){
          lh+='<div class="item'+(m.unread?' unread':'')+(i===0?' active':'')+'" data-i="'+i+'">'+(m.unread?'<span class="unreaddot"></span>':'')
            +'<div class="top"><span class="from">'+m.from+'</span><span class="tm">'+m.tm+'</span></div>'
            +'<div class="subj">'+m.subj+'</div><div class="snip">'+m.snip+'</div></div>';
        });
        document.getElementById('list').innerHTML=lh;

        function render(m){
          document.getElementById('dhd').innerHTML=
            '<h1>'+m.subj+'</h1><div class="row"><div class="av" style="background:'+m.c+'">'+initials(m.from)+'</div>'
            +'<div><div class="nm">'+m.from+' &lt;'+m.em+'&gt;</div><div class="to">to me</div></div>'
            +'<div class="spacer"></div><span class="tm">'+m.tm+'</span>'
            +'<div class="actbtn"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 17l-5-5 5-5M4 12h13a4 4 0 010 8h-1"/></svg></div>'
            +'<div class="actbtn"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></div></div>';
          var mb=m.body.map(function(p){return '<p>'+p.replace(/\n/g,'<br>')+'</p>';}).join('');
          document.getElementById('thread').innerHTML=
            '<div class="mail"><div class="mhd"><div class="av" style="background:'+m.c+'">'+initials(m.from)+'</div><div><div style="font-weight:700;color:var(--text)">'+m.from+'</div><div style="color:var(--muted);font-size:12px">'+m.tm+'</div></div></div>'+mb+'</div>';
        }
        render(mails[0]);
        document.querySelectorAll('.item').forEach(function(it){it.addEventListener('click',function(){
          document.querySelectorAll('.item').forEach(function(x){x.classList.remove('active');});it.classList.add('active');it.classList.remove('unread');
          var d=it.querySelector('.unreaddot');if(d)d.remove();
          render(mails[+it.getAttribute('data-i')]);});});
        document.querySelectorAll('.fold').forEach(function(f){f.addEventListener('click',function(){
          document.querySelectorAll('.fold').forEach(function(x){x.classList.remove('active');});f.classList.add('active');});});

        var root=document.documentElement;
        // no dedicated toggle button visible; provide via double-click compose? Instead add floating handled below.
        var moon,sun;
        function apply(t){root.setAttribute('data-theme',t);if(moon)moon.style.display=t==='dark'?'none':'';if(sun)sun.style.display=t==='dark'?'':'none';}
        var tt=document.getElementById('themeToggle');
        if(tt){moon=document.getElementById('iconMoon');sun=document.getElementById('iconSun');tt.addEventListener('click',function(){apply(root.getAttribute('data-theme')==='dark'?'light':'dark');});}
      })();
    </script>
    <!-- Floating theme toggle (no top navbar in this shell) -->
    <button id="themeToggle" title="Toggle theme" style="position:fixed;top:14px;right:16px;z-index:50;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--text-2);box-shadow:var(--shadow);">
      <svg class="icon" id="iconMoon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      <svg class="icon" id="iconSun" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </body>
</html>
