<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Centered Single Column — preview</title>
    <style>
      /* ============================================================
         Centered Single · Flowbite-inspired · WYSIWYG · Light/Dark
         ============================================================ */
      :root{ --radius:12px; --radius-sm:8px; }
      [data-theme="light"]{
        --primary:#1a56db; --primary-weak:#eff6ff; --primary-soft:#e1effe; --on-primary:#fff;
        --bg:#f9fafb; --surface:#ffffff; --surface-2:#f3f4f6;
        --border:#e5e7eb; --border-strong:#d1d5db;
        --text:#111827; --text-2:#374151; --muted:#6b7280; --muted-2:#9ca3af;
        --green:#0e9f6e; --red:#e02424;
        --shadow:0 1px 2px rgba(0,0,0,.05); --shadow-lg:0 20px 40px -12px rgba(17,24,39,.18),0 4px 12px rgba(17,24,39,.06);
      }
      [data-theme="dark"]{
        --primary:#3f83f8; --primary-weak:#1e293b; --primary-soft:#233150; --on-primary:#fff;
        --bg:#0b1220; --surface:#1f2937; --surface-2:#111827;
        --border:#374151; --border-strong:#4b5563;
        --text:#f9fafb; --text-2:#e5e7eb; --muted:#9ca3af; --muted-2:#6b7280;
        --green:#31c48d; --red:#f98080;
        --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 24px 48px -12px rgba(0,0,0,.6);
      }
      *,*::before,*::after{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}
      body{width:100vw;height:100vh;height:100dvh;overflow-y:auto;background:var(--bg);color:var(--text);
        font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
        transition:background .2s ease,color .2s ease;}
      .icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
      .icon-sm{width:16px;height:16px;}

      /* floating theme toggle */
      .theme-fab{position:fixed;top:16px;right:18px;z-index:50;width:42px;height:42px;border-radius:10px;
        display:grid;place-items:center;cursor:pointer;background:var(--surface);border:1px solid var(--border);
        color:var(--muted);box-shadow:var(--shadow);transition:background .15s,color .15s;}
      .theme-fab:hover{background:var(--surface-2);color:var(--text-2);}

      .stage{min-height:100%;display:grid;place-items:center;padding:56px 20px;
        background:radial-gradient(60% 60% at 50% 0%,var(--primary-weak),transparent 70%);}
      .card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);
        border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:36px 34px 30px;}
      .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;}
      .brand-logo{width:38px;height:38px;border-radius:10px;background:var(--primary);display:grid;place-items:center;color:#fff;}
      .brand-name{font-size:20px;font-weight:800;letter-spacing:-.02em;}
      h1{font-size:24px;font-weight:800;letter-spacing:-.02em;text-align:center;margin:0 0 6px;}
      .sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 26px;}

      .field{margin-bottom:16px;}
      .field label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px;}
      .input{position:relative;display:flex;align-items:center;}
      .input svg{position:absolute;left:12px;color:var(--muted-2);}
      .input input{width:100%;height:44px;padding:0 12px 0 40px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
        background:var(--surface-2);color:var(--text);font:inherit;font-size:14px;outline:none;transition:border .15s,box-shadow .15s;}
      .input input::placeholder{color:var(--muted-2);}
      .input input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:var(--surface);}
      .row-between{display:flex;align-items:center;justify-content:space-between;margin:2px 0 22px;font-size:13px;}
      .check{display:flex;align-items:center;gap:8px;color:var(--text-2);cursor:pointer;}
      .check .box{width:16px;height:16px;border-radius:4px;border:1px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;color:#fff;}
      .check input{display:none;}
      .check input:checked + .box{background:var(--primary);border-color:var(--primary);}
      .link{color:var(--primary);font-weight:600;text-decoration:none;}
      .btn{width:100%;height:46px;border:0;border-radius:var(--radius-sm);background:var(--primary);color:var(--on-primary);
        font:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s;}
      .btn:hover{filter:brightness(.94);}
      .divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--muted-2);font-size:12px;}
      .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}
      .oauth{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
      .oauth button{height:44px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);
        color:var(--text-2);font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;}
      .oauth button:hover{background:var(--surface-2);}
      .foot{text-align:center;color:var(--muted);font-size:13px;margin-top:24px;}
    </style>
  </head>
  <body>
    <button class="theme-fab" id="themeToggle" title="Toggle theme">
      <svg class="icon" id="iconMoon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      <svg class="icon" id="iconSun" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <div class="stage">
      <div class="card">
        <div class="brand">
          <div class="brand-logo"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg></div>
          <span class="brand-name">DesignHub</span>
        </div>
        <h1>Welcome back</h1>
        <p class="sub">Sign in to continue to your workspace</p>

        <div class="field">
          <label>Email address</label>
          <div class="input">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input type="email" placeholder="you@company.com" value="olivia@designhub.io" />
          </div>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="input">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
            <input type="password" placeholder="••••••••••" value="password123" />
          </div>
        </div>

        <div class="row-between">
          <label class="check"><input type="checkbox" checked /><span class="box"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>Remember me</label>
          <a class="link" href="#">Forgot password?</a>
        </div>

        <button class="btn">Sign in <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>

        <div class="divider">OR CONTINUE WITH</div>
        <div class="oauth">
          <button><svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>Google</button>
          <button><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M9 8v8M15 8v8M9 12h6"/></svg>GitHub</button>
        </div>

        <p class="foot">Don't have an account? <a class="link" href="#">Create one</a></p>
      </div>
    </div>

    <script>
      (function(){
        var root=document.documentElement, moon=document.getElementById('iconMoon'), sun=document.getElementById('iconSun');
        function apply(t){root.setAttribute('data-theme',t);moon.style.display=t==='dark'?'none':'';sun.style.display=t==='dark'?'':'none';}
        document.getElementById('themeToggle').addEventListener('click',function(){
          apply(root.getAttribute('data-theme')==='dark'?'light':'dark');
        });
      })();
    </script>
  </body>
</html>
