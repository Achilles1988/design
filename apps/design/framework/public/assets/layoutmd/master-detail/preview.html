<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Master-Detail / Split — preview</title>
    <style>
      /* ============================================================
         Master-Detail · Flowbite-inspired · WYSIWYG · Light/Dark
         ============================================================ */
      :root{ --header-h:58px; --list-w:360px; }
      [data-theme="light"]{
        --primary:#1a56db; --primary-weak:#eff6ff; --primary-soft:#e1effe; --on-primary:#ffffff;
        --bg:#f9fafb; --surface:#ffffff; --surface-2:#f3f4f6;
        --border:#e5e7eb; --border-strong:#d1d5db;
        --text:#111827; --text-2:#374151; --muted:#6b7280; --muted-2:#9ca3af;
        --green:#0e9f6e; --green-bg:#def7ec; --red:#e02424; --red-bg:#fde8e8; --amber:#c27803; --amber-bg:#fdf6b2;
        --shadow:0 1px 2px rgba(0,0,0,.05);
      }
      [data-theme="dark"]{
        --primary:#3f83f8; --primary-weak:#1e293b; --primary-soft:#233150; --on-primary:#ffffff;
        --bg:#111827; --surface:#1f2937; --surface-2:#111827;
        --border:#374151; --border-strong:#4b5563;
        --text:#f9fafb; --text-2:#e5e7eb; --muted:#9ca3af; --muted-2:#6b7280;
        --green:#31c48d; --green-bg:#0b3b2e; --red:#f98080; --red-bg:#4a1414; --amber:#e3a008; --amber-bg:#3f2e05;
        --shadow:0 1px 2px rgba(0,0,0,.3);
      }
      *,*::before,*::after{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}
      body{width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
        font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
        transition:background .2s ease,color .2s ease;}
      .scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;}
      .scroll::-webkit-scrollbar{width:9px;}
      .scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
      .icon{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
      .icon-sm{width:16px;height:16px;}

      .grid{display:grid;grid-template-rows:var(--header-h) 1fr;height:100%;}
      .body{display:grid;grid-template-columns:var(--list-w) 1fr;min-height:0;}

      /* Header */
      .hd{display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--border);}
      .hd .logo{width:30px;height:30px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:#fff;}
      .hd .title{font-size:17px;font-weight:800;letter-spacing:-.02em;}
      .hd .spacer{flex:1;}
      .btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:inherit;}
      .btn.primary{background:var(--primary);color:var(--on-primary);} .btn.ghost{background:var(--surface);border-color:var(--border-strong);color:var(--text-2);}
      .nav-ico{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted);}
      .nav-ico:hover{background:var(--surface-2);color:var(--text-2);}

      /* List */
      .list{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
      .list-top{flex:0 0 auto;padding:14px 16px;border-bottom:1px solid var(--border);}
      .list-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-2);color:var(--muted);font-size:13px;}
      .list-tabs{display:flex;gap:4px;margin-top:10px;}
      .list-tabs span{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;color:var(--muted);cursor:pointer;}
      .list-tabs span.active{background:var(--primary-weak);color:var(--primary);}
      .list-body{flex:1;}
      .row{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;border-left:3px solid transparent;}
      .row:hover{background:var(--surface-2);} .row.active{background:var(--primary-weak);border-left-color:var(--primary);}
      .row .av{width:40px;height:40px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;}
      .row .mid{flex:1;min-width:0;}
      .row .rt{display:flex;justify-content:space-between;gap:8px;}
      .row .nm{font-weight:700;color:var(--text);} .row .tm{font-size:12px;color:var(--muted-2);flex:0 0 auto;}
      .row .snip{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
      .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;}
      .pill.ok{color:var(--green);background:var(--green-bg);} .pill.pend{color:var(--amber);background:var(--amber-bg);} .pill.off{color:var(--muted);background:var(--surface-2);}
      .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}

      /* Detail */
      .detail{min-height:0;}
      .detail-inner{padding:26px 30px 40px;max-width:760px;}
      .detail .dhd{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
      .detail .dav{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;}
      .detail h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;} .detail .sub{color:var(--muted);font-size:14px;}
      .detail .spacer{flex:1;}
      .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
      .fact{border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:var(--surface);box-shadow:var(--shadow);}
      .fact .l{font-size:12px;color:var(--muted);} .fact .v{font-size:17px;font-weight:700;color:var(--text);margin-top:3px;}
      .sec{margin-bottom:22px;} .sec h3{font-size:14px;font-weight:700;color:var(--text);margin:0 0 10px;}
      .sec p{margin:0 0 12px;color:var(--text-2);}
      .kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
      .kv:last-child{border-bottom:0;} .kv .k{color:var(--muted);} .kv .v{font-weight:600;color:var(--text);}
      .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);}
    </style>
  </head>
  <body>
    <div class="grid">
      <!-- Header -->
      <header class="hd">
        <div class="logo"><svg class="icon" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
        <span class="title">Support Inbox</span>
        <div class="spacer"></div>
        <div class="nav-ico" id="themeToggle" title="Toggle theme">
          <svg class="icon" id="iconMoon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          <svg class="icon" id="iconSun" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </div>
        <button class="btn primary"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New ticket</button>
      </header>

      <div class="body">
        <!-- Master list -->
        <div class="list">
          <div class="list-top">
            <div class="list-search"><svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><span>Search tickets…</span></div>
            <div class="list-tabs"><span class="active">Open · 6</span><span>Pending · 3</span><span>Closed</span></div>
          </div>
          <div class="list-body scroll" id="list"></div>
        </div>

        <!-- Detail -->
        <main class="detail scroll">
          <div class="detail-inner" id="detail"></div>
        </main>
      </div>
    </div>

    <script>
      (function(){
        var tickets=[
          {id:"#4821",nm:"Olivia Bennett",em:"olivia@acme.io",c:"#1a56db",subj:"Cannot export dashboard to PDF",snip:"The export button spins forever and never…",tm:"2m",st:["pend","Pending"],pri:"High",cat:"Bug",created:"Jul 9, 2026",body:"When I click Export → PDF on the analytics dashboard, the button shows a spinner but nothing downloads. This happens on both Chrome and Safari. It worked fine last week."},
          {id:"#4820",nm:"Liam Carter",em:"liam@nova.dev",c:"#0e9f6e",subj:"Feature request: dark mode for reports",snip:"Would love a dark theme option in the…",tm:"18m",st:["ok","Open"],pri:"Low",cat:"Feature",created:"Jul 9, 2026",body:"Our team works late and the bright report pages are hard on the eyes. A dark mode toggle that also applies to exported reports would be fantastic."},
          {id:"#4819",nm:"Emma Nguyen",em:"emma@pixel.co",c:"#e74694",subj:"Billing invoice shows wrong amount",snip:"The July invoice charged us for 12 seats…",tm:"1h",st:["pend","Pending"],pri:"High",cat:"Billing",created:"Jul 9, 2026",body:"Our July invoice charged for 12 seats but we only have 8 active members. Could you review and issue a corrected invoice for the difference?"},
          {id:"#4818",nm:"Noah Walker",em:"noah@orbit.io",c:"#c27803",subj:"SSO login redirect loop",snip:"After enabling SAML, users get stuck in…",tm:"3h",st:["ok","Open"],pri:"Urgent",cat:"Bug",created:"Jul 8, 2026",body:"After enabling SAML SSO, users are caught in a redirect loop between our IdP and your login page. Disabling SSO restores access immediately."},
          {id:"#4817",nm:"Ava Martinez",em:"ava@delta.com",c:"#7e3af2",subj:"How to invite external collaborators?",snip:"We want to give a contractor limited…",tm:"5h",st:["ok","Open"],pri:"Medium",cat:"Question",created:"Jul 8, 2026",body:"We'd like to give an external contractor view-only access to a single project without adding them to our whole workspace. Is that possible today?"},
          {id:"#4816",nm:"Ethan Brooks",em:"ethan@vertex.io",c:"#0694a2",subj:"API rate limit hit unexpectedly",snip:"We started receiving 429 responses even…",tm:"Yesterday",st:["off","Open"],pri:"Medium",cat:"API",created:"Jul 8, 2026",body:"We began receiving 429 rate-limit responses even though our request volume is well within the documented limits. Has the limit changed recently?"}
        ];
        function initials(n){return n.split(' ').map(function(x){return x[0];}).join('');}
        var lh='';
        tickets.forEach(function(t,i){
          lh+='<div class="row'+(i===0?' active':'')+'" data-i="'+i+'"><div class="av" style="background:'+t.c+'">'+initials(t.nm)+'</div>'
            +'<div class="mid"><div class="rt"><span class="nm">'+t.nm+'</span><span class="tm">'+t.tm+'</span></div>'
            +'<div style="font-weight:600;color:var(--text-2);margin-top:2px">'+t.subj+'</div>'
            +'<div class="snip">'+t.snip+'</div><div style="margin-top:6px"><span class="pill '+t.st[0]+'">'+t.st[1]+'</span></div></div></div>';
        });
        document.getElementById('list').innerHTML=lh;

        function renderDetail(t){
          document.getElementById('detail').innerHTML=
            '<div class="dhd"><div class="dav" style="background:'+t.c+'">'+initials(t.nm)+'</div>'
            +'<div><h1>'+t.subj+'</h1><div class="sub">'+t.id+' · opened by '+t.nm+' &lt;'+t.em+'&gt;</div></div>'
            +'<div class="spacer"></div><span class="pill '+t.st[0]+'">'+t.st[1]+'</span></div>'
            +'<div class="facts"><div class="fact"><div class="l">Priority</div><div class="v">'+t.pri+'</div></div>'
            +'<div class="fact"><div class="l">Category</div><div class="v">'+t.cat+'</div></div>'
            +'<div class="fact"><div class="l">Created</div><div class="v">'+t.created+'</div></div></div>'
            +'<div class="sec"><h3>Description</h3><div class="panel"><p style="margin:0">'+t.body+'</p></div></div>'
            +'<div class="sec"><h3>Details</h3><div class="panel"><div class="kv"><span class="k">Requester</span><span class="v">'+t.nm+'</span></div>'
            +'<div class="kv"><span class="k">Email</span><span class="v">'+t.em+'</span></div>'
            +'<div class="kv"><span class="k">Assignee</span><span class="v">Support Team</span></div>'
            +'<div class="kv"><span class="k">Channel</span><span class="v">Email</span></div></div></div>';
        }
        renderDetail(tickets[0]);
        document.querySelectorAll('.row').forEach(function(r){r.addEventListener('click',function(){
          document.querySelectorAll('.row').forEach(function(x){x.classList.remove('active');});r.classList.add('active');
          renderDetail(tickets[+r.getAttribute('data-i')]);});});
        document.querySelectorAll('.list-tabs span').forEach(function(s){s.addEventListener('click',function(){
          document.querySelectorAll('.list-tabs span').forEach(function(x){x.classList.remove('active');});s.classList.add('active');});});

        var root=document.documentElement, moon=document.getElementById('iconMoon'), sun=document.getElementById('iconSun');
        function apply(t){root.setAttribute('data-theme',t);moon.style.display=t==='dark'?'none':'';sun.style.display=t==='dark'?'':'none';}
        document.getElementById('themeToggle').addEventListener('click',function(){apply(root.getAttribute('data-theme')==='dark'?'light':'dark');});
      })();
    </script>
  </body>
</html>
