<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sidebar + Top Mix — preview</title>
    <style>
      /* ============================================================
         Sidebar + Top Mix · Flowbite-inspired · WYSIWYG · Light/Dark
         ============================================================ */
      :root{ --header-h:60px; --sidebar-w:240px; --radius:10px; --radius-sm:8px; }
      [data-theme="light"]{
        --primary:#1a56db; --primary-weak:#eff6ff; --primary-soft:#e1effe; --on-primary:#ffffff;
        --bg:#f9fafb; --surface:#ffffff; --surface-2:#f3f4f6;
        --border:#e5e7eb; --border-strong:#d1d5db;
        --text:#111827; --text-2:#374151; --muted:#6b7280; --muted-2:#9ca3af;
        --green:#0e9f6e; --green-bg:#def7ec; --red:#e02424; --red-bg:#fde8e8; --amber:#c27803; --amber-bg:#fdf6b2;
        --shadow:0 1px 2px rgba(0,0,0,.05); --shadow-md:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
      }
      [data-theme="dark"]{
        --primary:#3f83f8; --primary-weak:#1e293b; --primary-soft:#233150; --on-primary:#ffffff;
        --bg:#111827; --surface:#1f2937; --surface-2:#111827;
        --border:#374151; --border-strong:#4b5563;
        --text:#f9fafb; --text-2:#e5e7eb; --muted:#9ca3af; --muted-2:#6b7280;
        --green:#31c48d; --green-bg:#0b3b2e; --red:#f98080; --red-bg:#4a1414; --amber:#e3a008; --amber-bg:#3f2e05;
        --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 2px 6px rgba(0,0,0,.4);
      }
      *,*::before,*::after{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}
      body{width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
        font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
        transition:background .2s ease,color .2s ease;}
      .scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;}
      .scroll::-webkit-scrollbar{width:10px;}
      .scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
      .icon{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
      .icon-sm{width:16px;height:16px;}

      /* Navbar w/ primary module tabs */
      .nav{display:flex;align-items:center;gap:14px;height:100%;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);}
      .nav-brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;padding-right:8px;}
      .nav-logo{width:30px;height:30px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:#fff;}
      .nav-title{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--text);}
      .l1{display:flex;align-items:center;gap:2px;height:100%;margin-left:6px;}
      .l1-tab{display:flex;align-items:center;gap:8px;height:100%;padding:0 16px;color:var(--text-2);font-weight:600;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;}
      .l1-tab:hover{color:var(--text);}
      .l1-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
      .nav-spacer{flex:1;}
      .nav-actions{display:flex;align-items:center;gap:6px;color:var(--muted);}
      .nav-ico{position:relative;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;cursor:pointer;}
      .nav-ico:hover{background:var(--surface-2);color:var(--text-2);}
      .nav-ico .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface);}
      .nav-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#818cf8,#1a56db);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;}

      /* Secondary sidebar */
      .side{background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;}
      .side-head{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);padding:6px 12px 10px;}
      .side-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--text-2);font-weight:500;cursor:pointer;margin-bottom:2px;}
      .side-item:hover{background:var(--surface-2);}
      .side-item.active{background:var(--primary-weak);color:var(--primary);font-weight:600;}
      .side-item .txt{flex:1;} .side-item .badge{font-size:10px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary);}
      .side-sub{padding:2px 0 6px 22px;}
      .side-sub .side-item{font-size:13px;padding:7px 12px;}

      /* Main */
      .main-pad{padding:22px 26px 40px;}
      .page-title{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--text);margin:0 0 4px;}
      .page-sub{color:var(--muted);margin-bottom:20px;}
      .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;}
      .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
      .kpi .lbl{font-size:13px;color:var(--muted);} .kpi .val{font-size:26px;font-weight:800;color:var(--text);margin:6px 0 4px;}
      .kpi .delta{display:inline-flex;gap:3px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;}
      .kpi .delta.up{color:var(--green);background:var(--green-bg);} .kpi .delta.down{color:var(--red);background:var(--red-bg);}
      .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;}
      .panel-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
      .panel-hd h3{margin:0;font-size:16px;font-weight:700;color:var(--text);}
      .btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:inherit;}
      .btn.primary{background:var(--primary);color:var(--on-primary);} .btn.ghost{background:var(--surface);border-color:var(--border-strong);color:var(--text-2);}
      table{width:100%;border-collapse:collapse;font-size:13px;}
      thead th{text-align:left;padding:11px 20px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--border);}
      tbody td{padding:13px 20px;border-bottom:1px solid var(--border);color:var(--text-2);}
      tbody tr:last-child td{border-bottom:0;} tbody tr:hover{background:var(--surface-2);}
      .cell-user{display:flex;align-items:center;gap:11px;} .cell-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;}
      .cell-user .nm{font-weight:600;color:var(--text);} .cell-user .em{font-size:12px;color:var(--muted);}
      .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;}
      .pill.ok{color:var(--green);background:var(--green-bg);} .pill.pend{color:var(--amber);background:var(--amber-bg);} .pill.off{color:var(--muted);background:var(--surface-2);}
      .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
    </style>
  </head>
  <body>
    <div style="display:grid;grid-template-rows:var(--header-h) 1fr;height:100%;">
      <!-- Header: primary module tabs -->
      <header>
        <div class="nav">
          <div class="nav-brand"><div class="nav-logo"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg></div><span class="nav-title">EnterpriseOS</span></div>
          <div class="l1" id="l1">
            <div class="l1-tab active" data-mod="sales"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>Sales</div>
            <div class="l1-tab" data-mod="hr"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>People</div>
            <div class="l1-tab" data-mod="fin"><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Finance</div>
            <div class="l1-tab" data-mod="ops"><svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 01-.2 1.6M5 12a7 7 0 01.2-1.6"/></svg>Operations</div>
          </div>
          <div class="nav-spacer"></div>
          <div class="nav-actions">
            <div class="nav-ico" id="themeToggle" title="Toggle theme">
              <svg class="icon" id="iconMoon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
              <svg class="icon" id="iconSun" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </div>
            <div class="nav-ico"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span class="dot"></span></div>
            <div class="nav-avatar">JW</div>
          </div>
        </div>
      </header>

      <div style="display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:0;">
        <!-- Secondary sidebar (changes with module) -->
        <nav class="side scroll">
          <div class="side-head" id="modName">Sales</div>
          <div id="l2"></div>
        </nav>

        <!-- Main -->
        <main class="scroll">
          <div class="main-pad">
            <div class="page-title" id="pageTitle">Sales · Pipeline</div>
            <div class="page-sub">Track deals across every stage of the funnel.</div>
            <div class="kpis">
              <div class="kpi"><div class="lbl">Open pipeline</div><div class="val">$1.28M</div><span class="delta up">▲ 9.4%</span></div>
              <div class="kpi"><div class="lbl">Win rate</div><div class="val">34%</div><span class="delta up">▲ 2.1%</span></div>
              <div class="kpi"><div class="lbl">Avg deal size</div><div class="val">$18.2k</div><span class="delta down">▼ 1.3%</span></div>
            </div>
            <div class="panel">
              <div class="panel-hd"><h3>Top opportunities</h3><button class="btn primary"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New deal</button></div>
              <table><thead><tr><th>Owner</th><th>Account</th><th>Stage</th><th>Value</th></tr></thead><tbody id="rows"></tbody></table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script>
      (function(){
        var modules={
          sales:{name:"Sales",title:"Sales · Pipeline",items:[["Pipeline",1,""],["Leads",0,"48"],["Accounts",0,""],["Forecast",0,""],["Reports",0,""]]},
          hr:{name:"People",title:"People · Directory",items:[["Directory",1,""],["Recruiting",0,"6"],["Time off",0,""],["Payroll",0,""],["Reviews",0,""]]},
          fin:{name:"Finance",title:"Finance · Invoices",items:[["Invoices",1,"12"],["Expenses",0,""],["Budgets",0,""],["Ledger",0,""],["Taxes",0,""]]},
          ops:{name:"Operations",title:"Operations · Services",items:[["Services",1,""],["Incidents",0,"2"],["Deployments",0,""],["Runbooks",0,""],["Alerts",0,""]]}
        };
        function renderNav(mod){
          var m=modules[mod];
          document.getElementById('modName').textContent=m.name;
          document.getElementById('pageTitle').textContent=m.title;
          var h='';
          m.items.forEach(function(it){
            h+='<div class="side-item'+(it[1]?' active':'')+'"><svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg><span class="txt">'+it[0]+'</span>'+(it[2]?'<span class="badge">'+it[2]+'</span>':'')+'</div>';
          });
          document.getElementById('l2').innerHTML=h;
          document.querySelectorAll('#l2 .side-item').forEach(function(x){x.addEventListener('click',function(){
            document.querySelectorAll('#l2 .side-item').forEach(function(y){y.classList.remove('active');});x.classList.add('active');});});
        }
        renderNav('sales');
        document.querySelectorAll('#l1 .l1-tab').forEach(function(t){t.addEventListener('click',function(){
          document.querySelectorAll('#l1 .l1-tab').forEach(function(x){x.classList.remove('active');});t.classList.add('active');
          renderNav(t.getAttribute('data-mod'));});});

        var rows=[
          {n:"Olivia Bennett",e:"Acme Corp",c:"#1a56db",r:"Negotiation",s:["pend","Negotiation"],t:"$92,400"},
          {n:"Liam Carter",e:"Nova Labs",c:"#0e9f6e",r:"Proposal",s:["ok","Won"],t:"$48,000"},
          {n:"Emma Nguyen",e:"Pixel Studio",c:"#e74694",r:"Discovery",s:["off","Lost"],t:"$12,800"},
          {n:"Noah Walker",e:"Orbit Inc",c:"#c27803",r:"Proposal",s:["pend","Proposal"],t:"$63,500"},
          {n:"Ava Martinez",e:"Delta Group",c:"#7e3af2",r:"Negotiation",s:["ok","Won"],t:"$104,000"},
          {n:"Ethan Brooks",e:"Vertex LLC",c:"#0694a2",r:"Discovery",s:["pend","Discovery"],t:"$21,200"}
        ];
        var html='';
        rows.forEach(function(m){
          html+='<tr><td><div class="cell-user"><div class="cell-avatar" style="background:'+m.c+'">'+m.n.split(' ').map(function(x){return x[0];}).join('')+'</div><div class="nm">'+m.n+'</div></div></td>'
            +'<td>'+m.e+'</td><td><span class="pill '+m.s[0]+'">'+m.s[1]+'</span></td><td style="font-weight:700;color:var(--text)">'+m.t+'</td></tr>';
        });
        document.getElementById('rows').innerHTML=html;

        var root=document.documentElement, moon=document.getElementById('iconMoon'), sun=document.getElementById('iconSun');
        function apply(t){root.setAttribute('data-theme',t);moon.style.display=t==='dark'?'none':'';sun.style.display=t==='dark'?'':'none';}
        document.getElementById('themeToggle').addEventListener('click',function(){apply(root.getAttribute('data-theme')==='dark'?'light':'dark');});
      })();
    </script>
  </body>
</html>
