<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dual Sidebar — preview</title>
    <style>
      /* ============================================================
         Dual Sidebar (IM) · Flowbite-inspired · WYSIWYG · Light/Dark
         ============================================================ */
      :root{ --header-h:60px; --icon-w:72px; --nav2-w:260px; --radius:10px; --radius-sm:8px; }
      [data-theme="light"]{
        --primary:#1a56db; --primary-weak:#eff6ff; --primary-soft:#e1effe; --on-primary:#ffffff;
        --bg:#f9fafb; --surface:#ffffff; --surface-2:#f3f4f6; --rail:#1e293b;
        --border:#e5e7eb; --border-strong:#d1d5db;
        --text:#111827; --text-2:#374151; --muted:#6b7280; --muted-2:#9ca3af;
        --green:#0e9f6e; --green-bg:#def7ec; --red:#e02424; --amber:#c27803;
        --shadow:0 1px 2px rgba(0,0,0,.05); --shadow-md:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
      }
      [data-theme="dark"]{
        --primary:#3f83f8; --primary-weak:#1e293b; --primary-soft:#233150; --on-primary:#ffffff;
        --bg:#0b1220; --surface:#1f2937; --surface-2:#111827; --rail:#0b1220;
        --border:#374151; --border-strong:#4b5563;
        --text:#f9fafb; --text-2:#e5e7eb; --muted:#9ca3af; --muted-2:#6b7280;
        --green:#31c48d; --green-bg:#0b3b2e; --red:#f98080; --amber:#e3a008;
        --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 2px 6px rgba(0,0,0,.4);
      }
      *,*::before,*::after{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}
      body{width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
        font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
        transition:background .2s ease,color .2s ease;}
      .scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;}
      .scroll::-webkit-scrollbar{width:10px;}
      .scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
      .icon{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
      .icon-sm{width:16px;height:16px;}

      .shell{display:grid;grid-template-columns:var(--icon-w) var(--nav2-w) 1fr;height:100%;}

      /* Icon rail */
      .rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;}
      .rail-ws{position:relative;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;cursor:pointer;transition:border-radius .18s,background .18s;}
      .rail-ws:hover{border-radius:12px;background:rgba(255,255,255,.2);}
      .rail-ws.active{border-radius:12px;background:var(--primary);}
      .rail-ws.active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:5px;height:26px;border-radius:0 4px 4px 0;background:#fff;}
      .rail-sep{width:28px;height:2px;border-radius:2px;background:rgba(255,255,255,.14);margin:2px 0;}
      .rail-add{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#31c48d;cursor:pointer;}
      .rail-spacer{flex:1;}

      /* Channel list (nav2) */
      .nav2{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
      .nav2-hd{height:var(--header-h);flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);font-weight:800;font-size:16px;color:var(--text);}
      .nav2-body{flex:1;padding:10px 8px;}
      .ch-group{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2);padding:12px 10px 5px;display:flex;align-items:center;gap:6px;}
      .ch{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--radius-sm);color:var(--text-2);font-weight:500;cursor:pointer;margin-bottom:1px;}
      .ch:hover{background:var(--surface-2);}
      .ch.active{background:var(--primary-weak);color:var(--primary);font-weight:600;}
      .ch .hash{color:var(--muted-2);font-weight:700;}
      .ch .txt{flex:1;}
      .ch .cnt{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--red);color:#fff;}

      /* Chat main */
      .chat{display:flex;flex-direction:column;min-height:0;background:var(--bg);}
      .chat-hd{height:var(--header-h);flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--surface);}
      .chat-hd .title{font-weight:800;font-size:16px;color:var(--text);}
      .chat-hd .sub{color:var(--muted);font-size:13px;}
      .chat-hd .spacer{flex:1;}
      .chat-hd .members{display:flex;}
      .chat-hd .members .cell-avatar{margin-left:-8px;border:2px solid var(--surface);}
      .cell-avatar{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;}
      .chat-body{flex:1;padding:20px;}
      .msg{display:flex;gap:12px;margin-bottom:20px;}
      .msg .cell-avatar{width:40px;height:40px;font-size:14px;}
      .msg .who{font-weight:700;color:var(--text);} .msg .ts{font-size:12px;color:var(--muted);margin-left:8px;}
      .msg .body{color:var(--text-2);margin-top:3px;}
      .chat-input{flex:0 0 auto;padding:14px 20px 18px;}
      .chat-box{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;padding:10px 14px;color:var(--muted);box-shadow:var(--shadow);}
      .chat-box .grow{flex:1;}
    </style>
  </head>
  <body>
    <div class="shell">
      <!-- Icon rail: workspace switcher -->
      <div class="rail">
        <div class="rail-ws active" title="DesignHub">DH</div>
        <div class="rail-sep"></div>
        <div class="rail-ws" title="Acme Corp">AC</div>
        <div class="rail-ws" title="Nova Labs">NL</div>
        <div class="rail-ws" title="Pixel Studio">PS</div>
        <div class="rail-ws" title="Orbit">OR</div>
        <div class="rail-spacer"></div>
        <div class="rail-add" title="Add workspace"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
        <div class="rail-ws" id="themeToggle" title="Toggle theme">
          <svg class="icon" id="iconMoon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          <svg class="icon" id="iconSun" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </div>
      </div>

      <!-- Channel list -->
      <div class="nav2">
        <div class="nav2-hd">DesignHub <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
        <div class="nav2-body scroll">
          <div class="ch-group"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg> Channels</div>
          <div class="ch active"><span class="hash">#</span><span class="txt">general</span></div>
          <div class="ch"><span class="hash">#</span><span class="txt">design-system</span><span class="cnt">3</span></div>
          <div class="ch"><span class="hash">#</span><span class="txt">engineering</span></div>
          <div class="ch"><span class="hash">#</span><span class="txt">product</span><span class="cnt">12</span></div>
          <div class="ch"><span class="hash">#</span><span class="txt">random</span></div>
          <div class="ch-group"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg> Direct Messages</div>
          <div class="ch"><span class="cell-avatar" style="width:22px;height:22px;font-size:9px;background:#0e9f6e">OB</span><span class="txt">Olivia Bennett</span></div>
          <div class="ch"><span class="cell-avatar" style="width:22px;height:22px;font-size:9px;background:#7e3af2">LC</span><span class="txt">Liam Carter</span><span class="cnt">2</span></div>
          <div class="ch"><span class="cell-avatar" style="width:22px;height:22px;font-size:9px;background:#e74694">EN</span><span class="txt">Emma Nguyen</span></div>
          <div class="ch"><span class="cell-avatar" style="width:22px;height:22px;font-size:9px;background:#c27803">NW</span><span class="txt">Noah Walker</span></div>
        </div>
      </div>

      <!-- Chat main -->
      <div class="chat">
        <div class="chat-hd">
          <span class="hash" style="color:var(--muted-2);font-weight:700;font-size:18px">#</span>
          <span class="title">general</span>
          <span class="sub">· Company-wide announcements</span>
          <span class="spacer"></span>
          <div class="members">
            <div class="cell-avatar" style="background:#1a56db">OB</div>
            <div class="cell-avatar" style="background:#0e9f6e">LC</div>
            <div class="cell-avatar" style="background:#e74694">EN</div>
            <div class="cell-avatar" style="background:var(--surface-2);color:var(--muted)">+8</div>
          </div>
        </div>
        <div class="chat-body scroll" id="chatBody"></div>
        <div class="chat-input">
          <div class="chat-box">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            <span class="grow">Message #general…</span>
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
            <svg class="icon" style="color:var(--primary)" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function(){
        var msgs=[
          {w:"Olivia Bennett",c:"#1a56db",t:"9:02 AM",b:"Morning team! The Q3 roadmap review is scheduled for Thursday 2pm. Please add your topics to the shared doc."},
          {w:"Liam Carter",c:"#0e9f6e",t:"9:07 AM",b:"Thanks Olivia. I'll cover the new billing flow and the migration plan for the legacy dashboard."},
          {w:"Emma Nguyen",c:"#e74694",t:"9:15 AM",b:"Design tokens v2 just shipped to the component library — dark mode is now fully covered across all surfaces."},
          {w:"Noah Walker",c:"#c27803",t:"9:31 AM",b:"Deployed the search-index optimisation to staging. p95 latency dropped from 420ms to 180ms."},
          {w:"Ava Martinez",c:"#7e3af2",t:"9:44 AM",b:"Reminder: the design critique moved to #design-system. See you all there in 15 minutes."},
          {w:"Ethan Brooks",c:"#0694a2",t:"10:03 AM",b:"Incident on media-encoder is resolved. Root cause was a stale cache node. Postmortem doc incoming."},
          {w:"Sophia Reed",c:"#e02424",t:"10:20 AM",b:"Onboarding revamp is live for 10% of new users. Early activation numbers look promising — up 6 points."},
          {w:"Mason Cole",c:"#3f83f8",t:"10:41 AM",b:"Anyone free to pair on the notification-hub refactor this afternoon? Should take about an hour."}
        ];
        var h='';
        msgs.forEach(function(m){
          h+='<div class="msg"><div class="cell-avatar" style="background:'+m.c+'">'+m.w.split(' ').map(function(x){return x[0];}).join('')+'</div>'
           +'<div><div><span class="who">'+m.w+'</span><span class="ts">'+m.t+'</span></div><div class="body">'+m.b+'</div></div></div>';
        });
        document.getElementById('chatBody').innerHTML=h;

        document.querySelectorAll('.rail-ws').forEach(function(w){if(w.id==='themeToggle')return;w.addEventListener('click',function(){
          document.querySelectorAll('.rail-ws').forEach(function(x){if(x.id!=='themeToggle')x.classList.remove('active');});w.classList.add('active');});});
        document.querySelectorAll('.ch').forEach(function(c){c.addEventListener('click',function(){
          document.querySelectorAll('.ch').forEach(function(x){x.classList.remove('active');});c.classList.add('active');});});

        var root=document.documentElement, moon=document.getElementById('iconMoon'), sun=document.getElementById('iconSun');
        function apply(t){root.setAttribute('data-theme',t);moon.style.display=t==='dark'?'none':'';sun.style.display=t==='dark'?'':'none';}
        document.getElementById('themeToggle').addEventListener('click',function(){apply(root.getAttribute('data-theme')==='dark'?'light':'dark');});
      })();
    </script>
  </body>
</html>
