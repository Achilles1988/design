<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban / Board — preview</title>
    <style>
      /* ============================================================
         Kanban Board · Flowbite-inspired · WYSIWYG · Light/Dark
         ============================================================ */
      :root{ --header-h:60px; --radius:10px; --radius-sm:8px; }
      [data-theme="light"]{
        --primary:#1a56db; --primary-weak:#eff6ff; --primary-soft:#e1effe; --on-primary:#fff;
        --bg:#f9fafb; --surface:#ffffff; --surface-2:#f3f4f6; --col-bg:#f1f3f7;
        --border:#e5e7eb; --border-strong:#d1d5db;
        --text:#111827; --text-2:#374151; --muted:#6b7280; --muted-2:#9ca3af;
        --green:#0e9f6e; --green-bg:#def7ec; --red:#e02424; --red-bg:#fde8e8; --amber:#c27803; --amber-bg:#fdf6b2;
        --purple:#7e3af2; --purple-bg:#edebfe; --cyan:#0694a2; --cyan-bg:#d5f5f6;
        --shadow:0 1px 2px rgba(0,0,0,.06); --shadow-md:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
      }
      [data-theme="dark"]{
        --primary:#3f83f8; --primary-weak:#1e293b; --primary-soft:#233150; --on-primary:#fff;
        --bg:#0b1220; --surface:#1f2937; --surface-2:#111827; --col-bg:#131c2b;
        --border:#374151; --border-strong:#4b5563;
        --text:#f9fafb; --text-2:#e5e7eb; --muted:#9ca3af; --muted-2:#6b7280;
        --green:#31c48d; --green-bg:#0b3b2e; --red:#f98080; --red-bg:#4a1414; --amber:#e3a008; --amber-bg:#3f2e05;
        --purple:#ac94fa; --purple-bg:#2b2150; --cyan:#3dd6df; --cyan-bg:#0c3b3f;
        --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 2px 6px rgba(0,0,0,.4);
      }
      *,*::before,*::after{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}
      body{width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
        font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
        transition:background .2s ease,color .2s ease;display:grid;grid-template-rows:var(--header-h) 1fr;}
      .icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
      .icon-sm{width:16px;height:16px;}
      .scroll::-webkit-scrollbar{width:10px;height:10px;}
      .scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
      .scroll{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;}

      /* Header (fixed) */
      header{display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);z-index:10;}
      .brand{display:flex;align-items:center;gap:10px;}
      .brand-logo{width:30px;height:30px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:#fff;}
      .board-title{font-size:17px;font-weight:800;letter-spacing:-.02em;}
      .board-sub{font-size:12px;color:var(--muted);}
      .seg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;}
      .seg button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;}
      .seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
      .sp{flex:1;}
      .avs{display:flex;}
      .avs .av{width:32px;height:32px;border-radius:50%;border:2px solid var(--surface);margin-left:-8px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;}
      .avs .av:first-child{margin-left:0;}
      .avs .more{background:var(--surface-2);color:var(--muted);}
      .ico-btn{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted);}
      .ico-btn:hover{background:var(--surface-2);color:var(--text-2);}
      .btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:0;font-family:inherit;background:var(--primary);color:#fff;}
      .btn:hover{filter:brightness(.94);}
      .filter-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);font-size:13px;font-weight:600;cursor:pointer;}

      /* Board (horizontal scroll) */
      .board{overflow-x:auto;overflow-y:hidden;padding:18px 20px;}
      .cols{display:flex;gap:16px;height:100%;align-items:flex-start;}
      .col{flex:0 0 300px;display:flex;flex-direction:column;max-height:100%;background:var(--col-bg);border:1px solid var(--border);border-radius:12px;}
      .col-hd{display:flex;align-items:center;gap:9px;padding:14px 14px 10px;}
      .col-dot{width:9px;height:9px;border-radius:50%;}
      .col-hd .nm{font-weight:700;font-size:13px;}
      .col-hd .cnt{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:1px 8px;border-radius:999px;}
      .col-hd .add{margin-left:auto;color:var(--muted-2);cursor:pointer;}
      .col-hd .add:hover{color:var(--text-2);}
      .col-body{overflow-y:auto;padding:2px 12px 12px;display:flex;flex-direction:column;gap:10px;}
      .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px;box-shadow:var(--shadow);cursor:grab;transition:box-shadow .15s,transform .1s;}
      .card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
      .card .tags{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap;}
      .tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px;}
      .card h4{margin:0 0 6px;font-size:14px;font-weight:600;line-height:1.35;color:var(--text);}
      .card p{margin:0 0 12px;font-size:12px;color:var(--muted);line-height:1.5;}
      .card-foot{display:flex;align-items:center;justify-content:space-between;}
      .meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;}
      .meta span{display:inline-flex;align-items:center;gap:4px;}
      .card .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;}
      .add-card{margin:2px 12px 12px;padding:9px;border:1px dashed var(--border-strong);border-radius:9px;color:var(--muted);font-size:13px;font-weight:600;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
      .add-card:hover{color:var(--text-2);background:var(--surface-2);}
    </style>
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="brand"><div class="brand-logo"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg></div>
        <div><div class="board-title">Product Roadmap</div><div class="board-sub">Sprint 24 · 32 tasks</div></div>
      </div>
      <div class="seg"><button class="on"><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>Board</button><button><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>List</button><button><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Timeline</button></div>
      <div class="filter-chip"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M22 3H2l8 9.5V19l4 2v-8.5z"/></svg>Filter</div>
      <div class="sp"></div>
      <div class="avs"><div class="av" style="background:#1a56db">OB</div><div class="av" style="background:#0e9f6e">LC</div><div class="av" style="background:#e74694">EN</div><div class="av" style="background:#7e3af2">NW</div><div class="av more">+6</div></div>
      <div class="ico-btn" id="themeToggle" title="Toggle theme">
        <svg class="icon" id="iconMoon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        <svg class="icon" id="iconSun" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </div>
      <button class="btn"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add task</button>
    </header>

    <!-- Board -->
    <main class="board scroll">
      <div class="cols" id="cols"></div>
    </main>

    <script>
      (function(){
        var TAG={feature:['Feature','var(--primary)','var(--primary-soft)'],bug:['Bug','var(--red)','var(--red-bg)'],design:['Design','var(--purple)','var(--purple-bg)'],
          docs:['Docs','var(--cyan)','var(--cyan-bg)'],chore:['Chore','var(--amber)','var(--amber-bg)'],research:['Research','var(--green)','var(--green-bg)']};
        var AV={OB:'#1a56db',LC:'#0e9f6e',EN:'#e74694',NW:'#7e3af2',AM:'#c27803',EB:'#0694a2',SR:'#3f83f8'};
        function av(k){return '<div class="av" style="background:'+AV[k]+'">'+k+'</div>';}
        function tag(t){var d=TAG[t];return '<span class="tag" style="color:'+d[1]+';background:'+d[2]+'">'+d[0]+'</span>';}
        function card(c){
          var tags=c.t.map(tag).join('');
          return '<div class="card"><div class="tags">'+tags+'</div><h4>'+c.title+'</h4>'
            +(c.desc?'<p>'+c.desc+'</p>':'')
            +'<div class="card-foot"><div class="meta">'
            +'<span><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>'+c.cm+'</span>'
            +'<span><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>'+c.done+'/'+c.total+'</span>'
            +'</div>'+av(c.a)+'</div></div>';
        }
        var COLS=[
          {name:'Backlog',color:'#9ca3af',cards:[
            {t:['research'],title:'Audit current onboarding funnel drop-off',desc:'Identify where new users abandon setup.',cm:4,done:1,total:5,a:'AM'},
            {t:['feature'],title:'Multi-workspace switcher in top bar',cm:2,done:0,total:3,a:'OB'},
            {t:['chore'],title:'Upgrade design token pipeline to v2',cm:1,done:2,total:6,a:'SR'},
            {t:['docs'],title:'Write migration guide for tokens 2.0',cm:0,done:0,total:4,a:'EB'}
          ]},
          {name:'To do',color:'#1a56db',cards:[
            {t:['feature','design'],title:'Redesign empty states across app',desc:'Illustrations + helpful primary action.',cm:6,done:2,total:7,a:'EN'},
            {t:['bug'],title:'Fix dark mode contrast on charts',cm:3,done:0,total:2,a:'LC'},
            {t:['feature'],title:'Keyboard shortcuts overlay',cm:1,done:0,total:5,a:'OB'}
          ]},
          {name:'In progress',color:'#c27803',cards:[
            {t:['design'],title:'Component library — form controls',desc:'Inputs, selects, toggles, validation states.',cm:9,done:4,total:8,a:'EN'},
            {t:['feature'],title:'Real-time comments on canvas',cm:12,done:6,total:9,a:'NW'},
            {t:['bug'],title:'Sidebar scroll jumps on collapse',cm:2,done:1,total:2,a:'LC'}
          ]},
          {name:'In review',color:'#7e3af2',cards:[
            {t:['feature'],title:'Export to production-ready React',desc:'Framework-agnostic codegen.',cm:5,done:5,total:5,a:'SR'},
            {t:['docs'],title:'API reference for tokens endpoint',cm:3,done:3,total:3,a:'EB'}
          ]},
          {name:'Done',color:'#0e9f6e',cards:[
            {t:['feature'],title:'Team invite flow with roles',cm:8,done:6,total:6,a:'OB'},
            {t:['chore'],title:'Migrate CI to new runners',cm:2,done:4,total:4,a:'SR'},
            {t:['design'],title:'Refresh marketing hero visuals',cm:4,done:3,total:3,a:'EN'},
            {t:['bug'],title:'Resolve avatar upload timeout',cm:1,done:2,total:2,a:'LC'}
          ]}
        ];
        var html='';
        COLS.forEach(function(col){
          var body=col.cards.map(card).join('');
          html+='<section class="col"><div class="col-hd"><span class="col-dot" style="background:'+col.color+'"></span>'
            +'<span class="nm">'+col.name+'</span><span class="cnt">'+col.cards.length+'</span>'
            +'<svg class="icon icon-sm add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>'
            +'<div class="col-body scroll">'+body+'</div>'
            +'<div class="add-card"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add a card</div></section>';
        });
        document.getElementById('cols').innerHTML=html;

        document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.seg button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');});});
        var root=document.documentElement, moon=document.getElementById('iconMoon'), sun=document.getElementById('iconSun');
        function apply(t){root.setAttribute('data-theme',t);moon.style.display=t==='dark'?'none':'';sun.style.display=t==='dark'?'':'none';}
        document.getElementById('themeToggle').addEventListener('click',function(){
          apply(root.getAttribute('data-theme')==='dark'?'light':'dark');
        });
      })();
    </script>
  </body>
</html>
