<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <clipPath id="mask">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
    <linearGradient id="bg" x1="6" y1="2" x2="60" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a86d6"/>
      <stop offset="1" stop-color="#0a4a8a"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.8" stdDeviation="1.4" flood-color="#041829" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g clip-path="url(#mask)">
    <rect width="64" height="64" fill="url(#bg)"/>

    <!-- back layer card -->
    <g transform="translate(20 15) rotate(11 17 19)">
      <rect width="34" height="38" rx="5" fill="#0a3d73" opacity="0.85"/>
    </g>

    <!-- design draft artboard -->
    <g transform="translate(9 8) rotate(-7 20 23)" filter="url(#lift)">
      <rect width="40" height="46" rx="5" fill="#f8fafc"/>
      <rect x="3.5" y="3.5" width="33" height="39" rx="3" stroke="#0c5cab" stroke-width="2" fill="none"/>

      <!-- header -->
      <rect x="8" y="9" width="16" height="3.4" rx="1.5" fill="#0c5cab"/>
      <!-- text lines -->
      <rect x="8" y="16" width="24" height="2.2" rx="1.1" fill="#94a3b8" opacity="0.55"/>
      <rect x="8" y="21" width="18" height="2.2" rx="1.1" fill="#94a3b8" opacity="0.4"/>
      <!-- image placeholder (design shorthand) -->
      <rect x="8" y="27" width="24" height="12" rx="2" stroke="#94a3b8" stroke-width="1.5" fill="#e2e8f0" opacity="0.85"/>
      <path d="M10.5 37.5L19.5 28.5M29.5 37.5L20.5 28.5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- engineering handoff node -->
    <path
      d="M45 42c8 2.5 12.5 9 13.5 15"
      stroke="#e0f2fe"
      stroke-width="3.2"
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="58.5" cy="57.5" r="4.4" fill="#e0f2fe"/>
    <circle cx="58.5" cy="57.5" r="2.1" fill="#0c5cab"/>
  </g>
</svg>
